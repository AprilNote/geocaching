<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocaching</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
</head>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        width: 100%;
        overflow-x: hidden;
    }

    .question {
        background-color: #534AB7;
        max-width: 100%;
        height: 30%;
        padding: 1rem;
        padding-bottom: 1.5rem;
        color: #ffffff;
        font-family: "Geist", sans-serif;

    }

    .question-title {
        margin-bottom: 5vw;
        margin-top: 5vw;
    }

    html,
    body {
        height: 100%;
        max-width: 100%;
        overflow-x: hidden;
        font-family: "Geist", sans-serif;
        background: #EEEDFE;
        justify-content: center;
        padding: 0;
        margin: 0;
        width: 100%;
        overflow-x: hidden;

    }

    .btn {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        background-color: #ffffff;
        box-shadow: 0 2px 0 #AFA9EC;
        font-family: "Geist", sans-serif;
        font-size: 1rem;
        text-align: left;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        box-sizing: border-box;
        overflow-wrap: break-word;
    }

    .btn.selected-correct {
        background-color: #085041;
        border-color: #0F6E56;
        color: #ffffff;
    }

    .btn.selected-wrong {
        background-color: #8b0616;
        border-color: #cf1414;
        color: #ffffff;

    }

    .btn-list {
        gap: 1rem;
        display: flex;
        flex-direction: column;
        margin-top: -0.9rem;
        width: 100%;
        padding: 0 0.4rem;
    }

    .hidden {
        display: none;
    }

    .letter {
        width: 1.6rem;
        height: 1.6rem;
        min-width: 1.6rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #EEEDFE;
    }

    .feedback {
        border-radius: 8px;
        margin: 0.5rem;
        padding: 1rem;
        display: none;
        align-items: flex-start;
        gap: 0.5rem;
        font-family: "Geist", sans-serif;
        font-weight: 400;
    }

    .correct {
        background-color: #085041;
        color: #9FE1CB;
    }

    .wrong {
        background-color: #8b0616;
        color: #edacac;
    }

    .feedback-title {
        color: #ffffff;
        font-size: 1rem;
        font-weight: 500;
        margin-bottom: 1rem;
    }

    .feedback-body {
        font-weight: 400;
        font-size: 0.9rem;
        display: flex;
        flex-direction: column;
    }

    .feedback-text {
        display: flex;
        flex-direction: column;
    }

    .feedback-fact {
        color: #ffffff;
        font-family: "Geist", sans-serif;
        font-weight: 300;
        font-size: 0.9rem;
        margin-top: 1rem;

    }
</style>

<body>
    <div class="title question">
        <p class="question-title">QUESTION</p>
        <h2>Quel est l’animal connu pour posséder la morsure la plus puissante par rapport à sa taille?</h2>
    </div>

    <div class="btn-list">
        <button class="btn" value="wrong" onclick="select(this)"><span class="letter">A</span>Le crocodile
            marin</button>
        <button class="btn" value="wrong" onclick="select(this)""><span class=" letter">B</span>La hyène
        </button>
        <button class=" btn" value="wrong" onclick="select(this)""><span class=" letter">C</span>La fourmi
            piège</button>
        <button class=" btn" value="correct" onclick="select(this)""><span class=" letter">D</span>Le diable de
            Tasmanie</button>
    </div>

    <div class="feedback">
        <div class="feedback-text">
            <span class="feedback-title">Bravo!</span>
            <p class="feedback-body">Rapportée à sa taille, la morsure du diable de Tasmanie est extrêmement puissante,
                adaptée pour broyer des os.</p>
            <span class="feedback-fact">221&deg; SO - 32 pas.</span>
        </div>
    </div>

</body>

<script>
    const selectedButtons = document.querySelectorAll('.btn');
    const feedback = document.querySelector('.feedback');
    const feedbackTitle = document.querySelector('.feedback-title');
    const feedbackFact = document.querySelector('.feedback-fact');

    function select(btn) {
        const letter = btn.querySelector('.letter');

        selectedButtons.forEach(b => b.classList.remove('selected'));
        feedback.style.display = "flex";

        if (btn.value === 'correct') {
            btn.classList.add('selected-correct');
            feedback.classList.remove("hidden");
            feedback.classList.add("correct");
            letter.innerHTML = '✓';
            letter.style.backgroundColor = '#5DCAA5';
            feedbackTitle.classList.remove('hidden');

        } else {
            btn.classList.add('selected-wrong');
            letter.innerHTML = '✗';
            letter.style.backgroundColor = '#E24B4A';
            feedback.classList.remove("hidden");
            feedback.classList.add("wrong");
            feedbackTitle.innerHTML = 'Oopsi!';
            feedbackTitle.classList.remove('hidden');
            feedbackFact.innerHTML = "221&deg; SO";
        }
        selectedButtons.forEach(b => b.disabled = true);
    } </script>



</html>
