<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocaching</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
</head>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .question {
        background-color: #534AB7;
        max-width: 100vw;
        padding: 10vw;
        color: #ffffff;
        font-family: "Geist", sans-serif;
    }

    .q-word {
        margin-bottom: 5vw;
    }

    html,
    body {
        height: 100%;
        font-family: "Geist", sans-serif;
        background: #EEEDFE;
        display: flexbox;
        justify-content: center;
        padding: 0;
    }

    .btn {
        border: 1px solid #ccc;
        border-radius: 8px;
        margin: 0.4rem;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        background-color: #ffffff;
        box-shadow: 0 2px 0 #AFA9EC;
        font-family: "Geist", sans-serif;
        font-size: 1rem;
    }

    p {
        color: #CECBF6;
        font-weight: bold;
    }

    .btn.selected-correct {
        background-color: #085041;
        border-color: #0F6E56;
        color: #ffffff;
    }

    .btn.selected-wrong {
        background-color: #8b0616;
        border-color: #cf1414;
        color: #ffffff;

    }

    .btn-list {
        gap: 1rem;
        display: flex;
        flex-direction: column;
        margin-top: -0.9rem;
    }

    .hidden {
        display: none;
    }

    .letter {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #EEEDFE;
    }

    .correct {
        background-color: #085041;
        border-radius: 8px;
        margin: 0.5rem;
        padding: 1rem;
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        color: #9FE1CB;
        font-family: "Geist", sans-serif;
        font-weight: 400;
    }

    .tick {
        width: 1rem;
        height: 1rem;
        padding: 0.3rem 0.3rem;
        border: 0.05rem solid #9FE1CB;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.5rem;
        color: #9FE1CB;
    }

    .feedback-title {
        color: #ffffff;
        font-size: small;
        font-weight: 500;
    }

    .feedback-body {
        color: #9FE1CB;
        font-weight: 400;
        font-size: small;
        display: flex;
        flex-direction: column;
    }

    .feedback-text {
        display: flex;
        flex-direction: column;
    }

    .feedback-fact {
        color: #ffffff;
        font-family: "Geist", sans-serif;
        font-weight: 200;
        font-size: small;
        margin-top: 1rem;

    }
</style>

<body>
    <div class="title question">
        <p class="q-word">QUESTION 1</p>
        <h2>Quelle structure empêche les aliments d’entrer dans la trachée pendant la déglutition?</h2>
    </div>

    <div class="btn-list">
        <button class="btn" value="correct" onclick="select(this)"><span class="letter">A</span> Épiglotte</button>
        <button class="btn" value="wrong" onclick="select(this)""><span class=" letter">B</span> Luette</button>
        <button class=" btn" value="wrong" onclick="select(this)""><span class=" letter">C</span> Larynx</button>
        <button class=" btn" value="wrong" onclick="select(this)""><span class=" letter">D</span> Pharynx</button>
    </div>

    <div class="feedback hidden">
        <div class="correct hidden">
            <span class="tick">✔</span>
            <div class="feedback-text">
                <span class="feedback-title">Bravo!</span>
                <p class="feedback-body">L’épiglotte se replie sur les voies respiratoires pendant la déglutition pour
                    éviter les fausses routes.</p>
                <p class="feedback-fact">Fais 15 pas dans la direction de nord-est!</p>
            </div>
        </div>
    </div>

</body>

<script>
    const selectedButtons = document.querySelectorAll('.btn');
    const correctAnswer = document.querySelector('.correct');
    const wrongAnswer = document.querySelector('.wrong');
    const feedback = document.querySelector('.feedback');

    function select(btn) {
        const letter = btn.querySelector('.letter');
        selectedButtons.forEach(b => b.classList.remove('selected'));

        if (btn.value === 'correct') {
            btn.classList.add('selected-correct');
            feedback.classList.remove("hidden");
            correctAnswer.classList.remove("hidden");
            letter.innerHTML = '✓';
            letter.style.backgroundColor = '#5DCAA5';
            selectedButtons.forEach(b => b.value !== 'correct' ? b.disabled = true : b);

        } else {
            btn.classList.add('selected-wrong');
            letter.innerHTML = '✗';
            letter.style.backgroundColor = '#E24B4A';
            setTimeout(() => {
                btn.classList.remove('selected-wrong')
            }, 1000);

        }
    } function checkAnswer(btn) { } </script>



</html>
